[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gnosis"
version = "0.1.0"
description = "A local, private second brain powered by RAG and MCP"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    # Vector store
    "chromadb>=0.5.0",
    # Embeddings & reranking
    "sentence-transformers>=3.0.0",
    # PDF parsing
    "pymupdf>=1.24.0",
    # Web / URL loading
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.2.0",
    # BM25
    "rank-bm25>=0.2.2",
    # MCP server
    "fastmcp>=2.0.0",
    # CLI
    "typer>=0.12.0",
    "rich>=13.7.0",
    # Utilities
    "pydantic>=2.7.0",
    "python-dotenv>=1.0.0",
    "tqdm>=4.66.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[project.scripts]
gnosis = "gnosis.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["gnosis"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
